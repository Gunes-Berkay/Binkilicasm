# ==============================================================================
# BİNKILIÇ AİLE SAĞLIĞI MERKEZİ - GÜVENLİKLİ PRODUCTION NGİNX KONFİGÜRASYONU
# ==============================================================================

# 1. Anti-DDoS ve İstek Hızı Sınırlandırma (Rate Limiting)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=35r/s;

# 2. HTTP -> HTTPS Otomatik Yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name binkilicasm.com www.binkilicasm.com;

    # Let's Encrypt SSL Doğrulama Yolu
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Ana HTTPS Sunucusu (Tüm Güvenlik Kalkanları Aktif)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name binkilicasm.com www.binkilicasm.com;

    # SSL Sertifika Dosyaları (Certbot tarafından otomatik doldurulur)
    ssl_certificate /etc/letsencrypt/live/binkilicasm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/binkilicasm.com/privkey.pem;

    # Modern ve Güvenli SSL Protokolleri
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Güvenlik Başlıkları (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Sunucu Versiyon Bilgisini Gizle (Hacker taramalarını engeller)
    server_tokens off;

    # Dosya Yükleme Boyut Limiti (Zararlı büyük dosya saldırılarına karşı)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Kötü Amaçlı Botları ve Tarama Araçlarını Engelle
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|masscan|zgrab|acunetix|nessus|nmap)) {
        return 403;
    }

    # Gizli ve Hassas Dosyalara Erişimi Engelle (.git, .env, .htaccess, .sql)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # React Frontend Derlenmiş Statik Dosyaları
    root /var/www/binkilicasm/frontend/dist;
    index index.html;

    # Gzip Sıkıştırma (Sayfa açılış hızını 3 kat artırır)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Statik Varlıklar Önbellekleme (Cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # React SPA Yönlendirmesi (Sayfa yenilendiğinde 404 hatasını önler)
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Django Admin Paneli
    location /admin/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django REST API Uç Noktaları
    location /api/ {
        limit_req zone=api_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Statik ve Medya Dosyaları
    location /static/ {
        alias /var/www/binkilicasm/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/binkilicasm/backend/media/;
        expires 30d;
        access_log off;
    }
}
