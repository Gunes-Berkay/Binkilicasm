# ==============================================================================
# BİNKILIÇ AİLE SAĞLIĞI MERKEZİ - NGİNX PRODUCTION KONFİGÜRASYONU
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name binkilicasm.com.tr www.binkilicasm.com.tr 77.245.155.150;

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    server_tokens off;

    client_max_body_size 20M;

    # React Frontend Dosyaları
    root /var/www/binkilicasm/frontend/dist;
    index index.html;

    # Gzip Sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # React SPA Yönlendirmesi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django Admin Paneli
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Statik ve Medya Dosyaları
    location /static/ {
        alias /var/www/binkilicasm/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/binkilicasm/backend/media/;
        expires 30d;
        access_log off;
    }
}
